name: Static analysis (CodeQL + TruffleHog)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
  packages: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
  secrets:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: TruffleHog secret scan (verified + unknown)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
